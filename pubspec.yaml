name: petcare_connect_mobile
description: PetCare Connect - aplicación Android para gestión de mascotas y cuidados.
publish_to: "none"
version: 0.20.8+28
environment:
  sdk: ">=3.7.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  path: ^1.9.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.0
  timezone: ^0.10.1
  flutter_facebook_auth: ^7.2.0
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: 4.3.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon/petcare_icon.png
